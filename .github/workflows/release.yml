# Spec 49 — REX's installers, built by GitHub and published as a Release.
#
# One job per platform AND architecture, because `bundle-python.mjs` stages the
# host's CPython and then executes it: there is no cross-build, so the runner
# must be the architecture it ships. The repo is public, so the arm64 runners
# are free.
#
#   push to main (a merged PR)  → build all four, then publish one Release
#   pull request                → build all four, keep them as artifacts, no Release
#   workflow_dispatch           → the same as a pull request, by hand
#
# Every merge to main is a Release, tagged `v<package.json version>-<run number>`
# so two merges of the same version never collide. Bump `version` in
# package.json to change the number people see.

name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A newer push to the same PR makes the running build pointless. A merge to
  # main is never cancelled: a half-published Release is worse than a slow one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            artifact: macos-arm64
            args: --mac dmg --arm64
          - name: Windows x64
            runner: windows-latest
            artifact: windows-x64
            args: --win nsis --x64
          - name: Windows arm64
            runner: windows-11-arm
            artifact: windows-arm64
            args: --win nsis --arm64
          - name: Linux x64
            runner: ubuntu-latest
            artifact: linux-x64
            args: --linux deb rpm --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `uv` installs the relocatable CPython that ships inside REX (spec 46 §13).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `fpm` builds the .rpm with the host's `rpmbuild`; the .deb needs nothing.
      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      # `npm run package` is build + bundle:python + scripts/package.mjs, and the
      # extra arguments reach package.mjs. The arch flag is stated even though
      # package.mjs would default to the host's: a matrix row that disagrees
      # with its runner must fail loudly, not ship the wrong Python.
      - name: Build and package
        run: npm run package -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: rex-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-${{ github.run_number }}"
          ls -la dist
          # `--notes-file` is the install guide; `--generate-notes` appends the
          # list of merged pull requests since the previous Release below it.
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "REX ${version} (build ${{ github.run_number }})" \
            --notes-file .github/release-notes.md \
            --generate-notes
