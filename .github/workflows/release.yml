# Spec 49 — REX's installer, built by GitHub and published as a Release.
#
# **macOS only** (spec 50). There is no cross-build — `bundle-python.mjs`
# stages the host's CPython and then executes it — so the runner must be the
# architecture it ships, and `macos-latest` is arm64.
#
#   push to main (a merged PR)  → build, then publish one Release
#   workflow_dispatch           → build, keep it as an artifact, no Release
#
# Pull requests do not run it. The first version did, as a pre-merge check,
# and the reviewer's flow squash-merges a PR the moment it is opened, so the
# PR run only doubled every build (2026-09-07). The one time it earned its
# keep was that first day: the PR run passed on all four runners while the
# push run failed one step later, which is how the publish bug was found.
#
# Every merge to main is a Release, tagged `v<package.json version>-<run number>`
# so two merges of the same version never collide. Bump `version` in
# package.json to change the number people see.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a merge's build: a half-published Release is worse than a
  # slow one. Two merges in a row simply queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            artifact: macos-arm64
            args: --mac dmg --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `uv` installs the relocatable CPython that ships inside REX (spec 46 §13).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci

      # `npm run package` is build + bundle:python + scripts/package.mjs, and the
      # extra arguments reach package.mjs. The arch flag is stated rather than
      # left to the runner: a row that disagrees with its machine must fail
      # loudly, not ship the wrong Python.
      - name: Build and package
        run: npm run package -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: rex-${{ matrix.artifact }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-${{ github.run_number }}"
          ls -la dist
          # `--notes-file` is the install guide; `--generate-notes` appends the
          # list of merged pull requests since the previous Release below it.
          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "REX ${version} (build ${{ github.run_number }})" \
            --notes-file .github/release-notes.md \
            --generate-notes
