# Spec 49 — REX's installer, built by GitHub and published as a Release.
# Spec 57 — one version, one Release.
#
# **macOS only** (spec 50). There is no cross-build — `bundle-python.mjs`
# stages the host's CPython and then executes it — so the runner must be the
# architecture it ships, and `macos-latest` is arm64.
#
# A Release is tagged `v<package.json version>`, and the tag is the gate: a
# version is published once, by the first run on main that finds its tag
# missing. Every other run on main publishes nothing.
#
#   push to main, new version        → build, then publish `v<version>`
#   push to main, version released   → nothing runs past the version job
#   workflow_dispatch on main        → build; publish if the version is new
#   workflow_dispatch on a branch    → build, keep it as an artifact, no Release
#
# So a failed Release retries itself on the next push, or by hand with
# workflow_dispatch, because its tag was never made.
#
# Pull requests do not build. The first version did, as a pre-merge check,
# and the PR run only doubled every build (2026-09-07). What a pull request
# runs instead is version.yml, which fails it when `version` was not raised —
# so on a protected main every merge is a new version and every merge ships.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a merge's build: a half-published Release is worse than a
  # slow one. Two merges in a row simply queue, and the second finds the tag.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Is this version released?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        run: |
          version=$(node -p "require('./package.json').version")
          publish=false
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not main: build only, no Release." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "v${version} is already released. Raise \`version\` to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v${version} is new: build and publish." >> "$GITHUB_STEP_SUMMARY"
            publish=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            artifact: macos-arm64
            args: --mac dmg --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `uv` installs the relocatable CPython that ships inside REX (spec 46 §13).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci

      # `npm run package` is build + bundle:python + scripts/package.mjs, and the
      # extra arguments reach package.mjs. The arch flag is stated rather than
      # left to the runner: a row that disagrees with its machine must fail
      # loudly, not ship the wrong Python.
      - name: Build and package
        run: npm run package -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: rex-${{ matrix.artifact }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the Release
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          # `--notes-file` is the install guide; `--generate-notes` appends the
          # list of merged pull requests since the previous Release below it.
          gh release create "v${VERSION}" dist/* \
            --target "${{ github.sha }}" \
            --title "REX ${VERSION}" \
            --notes-file .github/release-notes.md \
            --generate-notes
