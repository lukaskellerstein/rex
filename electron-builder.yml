# Spec 46 §13 and milestone 4 — REX as something a person installs.
#
# The whole reason spec 46 exists: everything before it assumed a reviewer who
# runs `docker compose up` in another repository. After it, a person
# double-clicks an installer, opens Settings, adds their key or points at LM
# Studio, and REX works.
#
# **`python-dist/` is the thing that makes that true**, and `npm run bundle:python`
# has to have produced it before a build. It carries a relocatable CPython plus
# both Python packages, and it lands at `Resources/python/`, which is exactly
# where `interpreterFor()` looks (`src/main/python.ts`). If those two ever
# disagree, a packaged REX starts and neither child does.

appId: com.lukaskellerstein.rex
productName: REX
copyright: Copyright © 2026 Lukas Kellerstein

# **macOS only** (spec 50). Windows and Linux were built, installed and
# validated on 2026-09-07 and removed on 2026-09-08: REX claimed three
# operating systems and had holes in two, and one true platform beats three
# with footnotes. Spec 50 §5 records what those builds measured, which is the
# part worth keeping.

directories:
  output: release
  buildResources: build

# `out/` is electron-vite's build, and it is the whole application.
files:
  - out/**/*
  - package.json

# §13 — the runtime and the two packages, outside the asar so a child process
# can be spawned from them. An asar-packed interpreter cannot be executed.
extraResources:
  - from: python-dist
    to: python
    filter:
      - "**/*"
      # Never shipped: caches and test trees that are rebuilt or never read.
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/test/**"
      - "!**/tests/**"

  # §5.2 — the provider catalogue, which is DATA read from disk at runtime and
  # not a Python import. `src/main/gateway/catalogue.ts` opens
  # `packageRoot()/catalogue.json`, and in a packaged app `packageRoot()` is
  # `Resources/` — so the file has to land there and nowhere else.
  #
  # Measured 2026-09-07 by leaving it out: the app started, the gateway served
  # on 24334, and "Add a provider" listed nothing at all. It fails quietly by
  # design (an empty list beats taking Settings down over a missing file), so
  # the only symptom is a screen with no providers on it.
  - from: local-gateway/catalogue.json
    to: catalogue.json

asar: true
# `better-sqlite3` is native and must stay a real file on disk.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  # SPEC.md §9 — REX reads the documents a person points it at, and nothing else.
  # An entitlement it does not need is an entitlement somebody has to explain.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # **Signing and notarisation are deliberately not configured here.** They need
  # an Apple Developer identity, and spec 46 milestone 4 says they are "named
  # here and scoped in their own spec if they grow". An unsigned build is
  # runnable on the machine that made it, which is what a milestone needs;
  # shipping one to somebody else is a different job with a different owner.
  identity: null

