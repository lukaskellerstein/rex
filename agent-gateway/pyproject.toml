[project]
name = "agent-gateway"
version = "0.1.0"
description = "Agent SDKs and gateways behind one interface. Knows nothing about documents, comments or databases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "pydantic>=2.0",
]

[project.scripts]
agent-gateway = "agent_gateway.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
