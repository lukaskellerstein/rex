# BOTH LOCAL ENGINES, ONE GATEWAY, ONE PORT — 10 aliases, all free.
#
#   unsloth-4b      unsloth/gemma-4-E4B-it-qat-GGUF                     chat
#   unsloth-26b     unsloth/gemma-4-26B-A4B-it-qat-GGUF                 chat, 26B MoE
#   unsloth-embed   second-state/Nomic-embed-text-v1.5-Embedding-GGUF   embeddings
#   lms-4b          google/gemma-4-e4b                                  chat, tools + vision
#   lms-26b         google/gemma-4-26b-a4b-qat                          chat, 26B MoE
#   lms-embed       text-embedding-nomic-embed-text-v1.5                embeddings, 768 dims
#
#   …and `-anthropic` next to each chat alias — see § The `-anthropic` aliases.
#
# SWITCHING ENGINES IS NAMING A DIFFERENT MODEL. Nothing restarts and nothing is
# edited: `unsloth-26b` and `lms-26b` are two rules on the same listener. That is
# the whole reason this file exists.
#
# MERGED FROM `ai-gateway/envoy/config/unsloth.yaml` AND `…/lms.yaml` ON
# 2026-09-04. That repo keeps one file per engine and picks one with
# GATEWAY_ENGINE; REX needs both at once, so the two were merged here. The
# resources that are per-engine — Backend, AIServiceBackend, Secret,
# BackendSecurityPolicy — appear twice, once per engine. The five that describe
# the listener appear once. README.md § Where this came from says how to re-sync.
#
# THE SHAPE OF THIS FILE IS KUBERNETES CUSTOM RESOURCES, even though there is no
# Kubernetes anywhere. `aigw run` reads the same API the Envoy AI Gateway
# controller reads in a cluster, translates it in-process, and starts a real
# Envoy with it. That is the point: what is proven here is what would deploy.
#
# THE RESOURCES, and every one is load-bearing:
#   GatewayClass + Gateway           the listener on 1975            once
#   EnvoyProxy                       log level and access-log format once
#   AIGatewayRoute                   THE ALIASES — one rule each     once
#   ClientTrafficPolicy              the 50Mi buffer                 once
#   Backend                          where the engine is             per engine
#   AIServiceBackend                 what protocol it speaks         2 per engine
#   Secret + BackendSecurityPolicy   the key sent upstream           per engine
#
# BEFORE YOU CALL IT:
#
#   Unsloth  `Settings -> API -> Model auto-switch` MUST BE ON, or the first call
#            to a model that is not resident returns `400 No model loaded`. It
#            holds ONE model at a time, chat and embedder alike, so `unsloth-embed`
#            evicts `unsloth-26b` and the next chat call swaps it back.
#   LMStudio JIT-loads what is not resident, at 8192 context with a 1 h TTL,
#            ignoring the numbers below. Load first; `lms ps --json` is the truth:
#              lms load google/gemma-4-e4b         --context-length 131072 --parallel 1 --gpu max
#              lms load google/gemma-4-26b-a4b-qat --context-length 262144 --parallel 1 --gpu max
#              lms load text-embedding-nomic-embed-text-v1.5
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigw-run
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aigw-run
  namespace: default
spec:
  gatewayClassName: aigw-run
  listeners:
    - name: http
      protocol: HTTP
      # THE SAME NUMBER INSIDE AND OUTSIDE, DELIBERATELY. Upstream listens on 1975
      # and publishes it on another port, so the line aigw prints at start —
      # `Envoy AI Gateway listening on http://localhost:1975` — names a port that
      # does not work from the host. Listening on 26334 and mapping 26334:26334
      # makes that line true: what it prints is what you call.
      #
      # Changing this number means changing compose.yml's port mapping too.
      # The reviewer's own copy publishes 26000, so both can run at once.
      port: 26334
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway
  namespace: default
spec:
  logging:
    level:
      # `error` keeps the container log to access lines plus real failures. Raise
      # to `debug` and Envoy dumps request headers — INCLUDING the Authorization
      # header the extproc injects with the backend key.
      default: error
  telemetry:
    accessLog:
      settings:
        # One JSON line per LLM request, carrying TOKEN COUNTS AND TIMINGS ONLY —
        # never the prompt or the response.
        #
        # IT ONLY REACHES `compose logs` WHEN AIGW_DEBUG=true. Envoy runs as a
        # child of aigw, and with debug off its stdout goes to a file inside the
        # container (~/.local/state/aigw/envoy-runs/0/stdout.log) that no shell
        # can reach — the image is distroless.
        #
        # AIGW_DEBUG=true ALSO DUMPS FULL REQUEST AND RESPONSE BODIES — prompts
        # and replies included, with only the Authorization header redacted.
        #
        # `gen_ai.provider.name` IS THE FIELD THAT MATTERS HERE. With both
        # engines on one listener it is what says which one served the call.
        - matches:
            - "request.headers['x-ai-eg-model'] != ''"
          sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              # These dynamic-metadata keys must match the llmRequestCosts names
              # declared on the AIGatewayRoute below, or they log as empty.
              gen_ai.request.model: "%REQ(X-AI-EG-MODEL)%"
              gen_ai.response.model: "%DYNAMIC_METADATA(io.envoy.ai_gateway:response_model)%"
              gen_ai.provider.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:backend_name)%"
              gen_ai.usage.input_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              gen_ai.usage.output_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              gen_ai.usage.reasoning_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_reasoning_token)%"
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              request.path: "%REQ(:PATH)%"
              response_code: "%RESPONSE_CODE%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: aigw-run
  namespace: default
spec:
  parentRefs:
    - name: aigw-run
      kind: Gateway
      group: gateway.networking.k8s.io
  # THE ALIAS LIST — ONE ROUTE, BOTH ENGINES. One rule per alias, matched EXACTLY
  # on `x-ai-eg-model`, which the gateway fills in from the request body's `model`
  # field before routing. `modelNameOverride` is what actually goes upstream, so
  # the caller says the alias and the engine sees its own model id.
  #
  # THE ALIAS IS THE ENGINE SELECTOR. `lms-*` rules reach the `lms` backends and
  # `unsloth-*` rules reach the `unsloth` backends, so one listener serves both
  # and a caller switches engine by changing one string.
  #
  # AN UNKNOWN ALIAS MATCHES NO RULE AND GETS 404. With both engines here that
  # now means a typo, not another engine's name.
  #
  # 60 MINUTES ON EVERY RULE, NOT THE 120s UPSTREAM'S EXAMPLE USES. Prompt
  # processing measures ~100 tok/s on this machine, so an agent-scale prompt
  # needs 5-15 minutes before its first token.
  rules:
    # ── Unsloth Studio, port 8888 ────────────────────────────────────────────
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-4b
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/gemma-4-E4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-26b
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-embed
      backendRefs:
        - name: unsloth
          modelNameOverride: second-state/Nomic-embed-text-v1.5-Embedding-GGUF
      timeouts:
        request: 60m
    # ── LMStudio, port 1234 ──────────────────────────────────────────────────
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: lms-4b
      backendRefs:
        - name: lms
          modelNameOverride: google/gemma-4-e4b
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: lms-26b
      backendRefs:
        - name: lms
          modelNameOverride: google/gemma-4-26b-a4b-qat
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: lms-embed
      backendRefs:
        - name: lms
          modelNameOverride: text-embedding-nomic-embed-text-v1.5
      timeouts:
        request: 60m
    # ── The `-anthropic` aliases: PASS-THROUGH, not translation ──────────────
    #
    # THESE EXIST FOR AN AGENT, AND ONLY AN AGENT NEEDS THEM. The plain aliases
    # above reach a backend whose schema is `OpenAI`, so a call to
    # /anthropic/v1/messages is TRANSLATED Anthropic -> OpenAI on the way in. That
    # translation passes `thinking` blocks STRAIGHT INTO the OpenAI body, where a
    # `content` part may only be `text` or `image_url`. Envoy builds those blocks
    # itself, out of the engine's `reasoning_content`.
    #
    # So a one-shot call works and an agent turn cannot: the client sends the
    # assistant's previous reply back on turn two, thinking block and all, and the
    # ENGINE answers
    #     400 messages.N.content.str: Input should be a valid string
    # which reads like "content must be a string" and means "no branch of the
    # content union matched".
    #
    # IT IS NOT THE GATEWAY'S BUG. The identical error comes back from Unsloth on
    # 8888 and LMStudio on 1234 with no gateway in the path — measured 2026-09-04.
    # It was INTERMITTENT, about 1 run in 5, because the engines emit
    # `reasoning_content` on some replies and not others.
    #
    # These rules reach the `-anthropic` backends instead, whose schema is
    # `Anthropic`, so the body goes upstream UNTRANSLATED. Both engines serve
    # POST /v1/messages natively, so there is nothing to bridge.
    #
    # A SECOND ALIAS IS THE ONLY WAY TO SAY IT. An AIGatewayRoute rule matches on
    # HEADERS ALONE (`AIGatewayRouteRuleMatch` has no path field), and the header
    # it matches is the body's `model`. So the protocol has to be chosen by the
    # name the caller asks for. `modelNameOverride` sends the engine its own id
    # either way, so the two aliases are one model on one engine.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-4b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/gemma-4-E4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-26b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: lms-4b-anthropic
      backendRefs:
        - name: lms-anthropic
          modelNameOverride: google/gemma-4-e4b
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: lms-26b-anthropic
      backendRefs:
        - name: lms-anthropic
          modelNameOverride: google/gemma-4-26b-a4b-qat
      timeouts:
        request: 60m
  # What lands in the access log above. Without these the token fields are empty.
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_reasoning_token
      type: ReasoningToken
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigw-run
  connection:
    # ENVOY'S DEFAULT IS 32 KiB AND THAT IS TOO SMALL FOR AI TRAFFIC. A base64
    # image or a long agent transcript exceeds it and the request fails before it
    # reaches the model. It attaches to the Gateway, so one policy covers both
    # engines. Upstream ships this same 50Mi policy in its own example.
    bufferLimit: 50Mi
---
# ═══ Unsloth Studio ═════════════════════════════════════════════════════════
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unsloth
  namespace: default
spec:
  endpoints:
    # Unsloth Studio runs NATIVELY on the host for the GPU and binds 127.0.0.1
    # only. compose.yml maps host.docker.internal to the host gateway so this
    # resolves — the `localhost:host-gateway` trick does not work with aigw.
    #
    # HOSTNAME AND PORT ARE SEPARATE FIELDS HERE, so there is no URL to put in one
    # environment variable. Change the port here.
    - fqdn:
        hostname: host.docker.internal
        port: 8888
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: unsloth
  namespace: default
spec:
  timeouts:
    # The per-BACKEND ceiling, separate from the per-ROUTE one above. Both have to
    # be raised: whichever is smaller wins, and upstream's default here is 3m.
    request: 60m
  schema:
    # `OpenAI` is a PROTOCOL, not a company. `prefix` defaults to /v1.
    name: OpenAI
  backendRef:
    name: unsloth
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
# THE SAME ENGINE, ADDRESSED IN ITS OWN PROTOCOL. One `Backend` — the endpoint
# above — can carry several `AIServiceBackend`s, and the schema is what each one
# MEANS by the bytes it forwards. This one says `Anthropic`, so
# /anthropic/v1/messages goes upstream as it arrived.
#
# It needs no `prefix`: Anthropic's own paths already start /v1.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: unsloth-anthropic
  namespace: default
spec:
  timeouts:
    request: 60m
  schema:
    name: Anthropic
  backendRef:
    name: unsloth
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: unsloth-apikey
  namespace: default
type: Opaque
stringData:
  # UNSLOTH IS THE ONE LOCAL ENGINE THAT NEEDS A REAL KEY: without it every
  # unsloth route answers `401 Not authenticated`, /v1/models included. It arrives
  # from the shell (~/Projects/.envrc) and aigw substitutes ${UNSLOTH_API_KEY}
  # before parsing this file, so no plaintext copy is written here. A BLANK VALUE
  # SUBSTITUTES EMPTY and every unsloth call then 401s at request time — the lms
  # aliases are unaffected.
  apiKey: ${UNSLOTH_API_KEY}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: unsloth-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: unsloth
    # BOTH BACKENDS, or the `-anthropic` aliases 401 on every call. The policy
    # attaches to an AIServiceBackend and not to the `Backend` they share, so a
    # second backend over the same endpoint needs naming here too.
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: unsloth-anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: unsloth-apikey
---
# ═══ LMStudio ═══════════════════════════════════════════════════════════════
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: lms
  namespace: default
spec:
  endpoints:
    # LMStudio runs NATIVELY on the host for the GPU and binds 127.0.0.1 only.
    - fqdn:
        hostname: host.docker.internal
        port: 1234
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: lms
  namespace: default
spec:
  timeouts:
    request: 60m
  schema:
    name: OpenAI
  backendRef:
    name: lms
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: lms-anthropic
  namespace: default
spec:
  timeouts:
    request: 60m
  schema:
    name: Anthropic
  backendRef:
    name: lms
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: lms-apikey
  namespace: default
type: Opaque
stringData:
  # LMStudio accepts ANY string and never checks it, so this is a literal rather
  # than a ${VAR}. Unsloth needs a real key; see its Secret above.
  apiKey: sk-lmstudio
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: lms-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: lms
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: lms-anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: lms-apikey
