# =============================================================================
# REX's OWN Envoy AI Gateway — http://localhost:26334.
#
# ONE GATEWAY, ONE CONFIG, BOTH LOCAL ENGINES. config/local.yaml carries the
# LMStudio and Unsloth aliases side by side on one listener, so switching engine
# is naming a different model:
#
#   {"model": "lms-4b",     …}   ->  LMStudio on the host, port 1234
#   {"model": "unsloth-4b", …}   ->  Unsloth Studio on the host, port 8888
#
# Nothing restarts and no variable is edited. There is no `GATEWAY_ENGINE` here.
#
# WHY THIS EXISTS. `~/Projects/Github/lukaskellerstein/ai-gateway` is the real
# home of these gateways and it is under heavy development. Spec 43 needs a
# gateway that does not move while REX is built against it, so this is a
# standalone copy REX starts and stops itself. A different port, a different
# compose project name, and nothing here reads that repo. Both projects can run
# at once — and on this machine both usually do.
#
#   cd infra/envoy && docker compose up -d
#   curl -fsS http://localhost:26334/v1/models
#   docker compose down
#
# `podman compose` works too. `docker` is what runs the reviewer's copy.
#
# ONE STOCK IMAGE, NO DATABASE, NO BUILD. This is `aigw run` — Envoy AI
# Gateway's standalone mode, a real Envoy data plane from a config file with no
# Kubernetes. The image ships the Envoy binary. It costs about 200 MiB, measured
# 2026-09-04.
#
# THIS IS INFRASTRUCTURE FOR DEVELOPMENT, NOT PART OF REX. It is a container on
# a port; REX itself still listens on nothing (invariant I3). REX is a client of
# it over HTTP, exactly as it would be of any hosted gateway.
# =============================================================================

# Distinct from `ai-gateway-envoy` so both projects can run at once.
name: rex-envoy

services:
  # ---------------------------------------------------------------------------
  # 26334 is the data plane: /v1/chat/completions, /v1/embeddings, /v1/models
  # and /anthropic/v1/messages. 26364 is the admin server: /metrics and /health,
  # and nothing else — it is NOT an Envoy admin port.
  #
  # THE PORTS MIRROR REX's OTHER TWO. 9334 is the debugger and 5334 is the Vite
  # dev server, so 26334 keeps the `334` family and stays in the same 26xxx band
  # as the original, which uses 26000 and 26064.
  #
  # THE IMAGE CARRIES ITS OWN HEALTHCHECK (`aigw healthcheck`, which GETs
  # localhost:1064/health), so none is declared here. `compose ps` reports it.
  #
  # THE IMAGE IS DISTROLESS — no shell, so `compose exec` cannot read anything
  # inside it. Use `compose logs gateway`.
  # ---------------------------------------------------------------------------
  gateway:
    image: docker.io/envoyproxy/ai-gateway-cli:latest
    restart: unless-stopped
    # THE MOUNT IS /etc/aigw AND NOT /app. `/app` IS THE BINARY in this image —
    # the Dockerfile copies the CLI to /app and sets it as the entrypoint — so
    # mounting a directory there replaces the program with a folder.
    command: ["run", "/etc/aigw/local.yaml"]
    ports:
      # 26334:26334, NOT 26334:1975. The listener in config/local.yaml is set to
      # 26334 so that the line aigw prints at start —
      #   Envoy AI Gateway listening on http://localhost:26334
      # — names the port that actually works from the host. With upstream's 1975
      # inside, that line points at a port nothing can reach from outside.
      - "26334:26334"
      - "26364:1064"
    volumes:
      - ./config:/etc/aigw:ro
    extra_hosts:
      # Both engines run natively on the host, for the GPU, and bind 127.0.0.1
      # only. config/local.yaml addresses them as host.docker.internal.
      #
      # THE `localhost:host-gateway` TRICK DOES NOT WORK WITH aigw — upstream's
      # own compose notes this — which is why the config names
      # host.docker.internal explicitly rather than localhost.
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    environment:
      # aigw substitutes ${VAR} in the config file before parsing it, which is
      # how the key reaches the Secret without ever being written to disk here.
      # A missing variable substitutes EMPTY and every unsloth route then 401s
      # at call time with the engine's own `Not authenticated`. The lms aliases
      # are unaffected: LMStudio accepts any string, so the config holds a
      # literal for it.
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      # THIS IS THE ONLY WAY TO SEE ANYTHING PER-REQUEST. Envoy runs as a child
      # of aigw, and with this off its stdout — where the JSON access log goes —
      # lands in a file inside the container that no shell can read.
      #
      # SET IT TO `true` AND YOU GET BOTH: one JSON access line per request
      # (model, token counts, status, duration, and which engine served it) AND
      # aigw's own debug dump, which carries the FULL PROMPT AND RESPONSE with
      # only the Authorization header redacted. Useful while building spec 43,
      # and the reason it is off here.
      #
      # `false` AND NOT EMPTY, DELIBERATELY. aigw parses this as a bool flag and
      # rejects an empty string — `${AIGW_DEBUG:-}` makes it crash-loop on
      # `--debug: bool value must be true, 1, yes, false, 0 or no but got ""`
      # before it reads one line of config.
      AIGW_DEBUG: ${AIGW_DEBUG:-false}

  # ---------------------------------------------------------------------------
  # banner — prints the URLs to call, then exits.
  #
  # WHY A SECOND CONTAINER. The gateway image is DISTROLESS: no shell, so there
  # is no way to make it say anything the aigw binary does not say itself. This
  # is a 9 MB alpine that waits until the data plane really answers and then
  # prints what to call. It exits 0 and shows as `Exited (0)` in `compose ps` —
  # that is done, not broken.
  #
  # IT WAITS ON THE DATA PLANE, NOT ON THE HEALTHCHECK. `condition:
  # service_healthy` would fire too early: the image's healthcheck GETs the admin
  # server on 1064, which goes green seconds before Envoy's listener accepts a
  # connection. So this polls /v1/models over the compose network instead, and
  # the banner is proof the gateway is callable rather than merely started.
  # ---------------------------------------------------------------------------
  banner:
    image: docker.io/library/alpine:latest
    restart: "no"
    depends_on:
      - gateway
    # `gateway` is the service name on the compose network, and 26334 is the
    # listener — the same number inside and outside, which is the point.
    command:
      - /bin/sh
      - -c
      - |
        until wget -q -O /dev/null http://gateway:26334/v1/models 2>/dev/null; do
          sleep 1
        done
        printf '\n'
        printf '  ┌──────────────────────────────────────────────────────┐\n'
        printf '  │  Envoy AI Gateway is ready                           │\n'
        printf '  ├──────────────────────────────────────────────────────┤\n'
        printf '  │  OpenAI      http://localhost:26334/v1               │\n'
        printf '  │  Anthropic   http://localhost:26334/anthropic        │\n'
        printf '  │  Models      http://localhost:26334/v1/models        │\n'
        printf '  │  Metrics     http://localhost:26364/metrics          │\n'
        printf '  ├──────────────────────────────────────────────────────┤\n'
        printf '  │  lms-*       LMStudio        localhost:1234          │\n'
        printf '  │  unsloth-*   Unsloth Studio  localhost:8888          │\n'
        printf '  │  ...-anthropic  for an agent — no translation        │\n'
        printf '  └──────────────────────────────────────────────────────┘\n'
        printf '\n'
