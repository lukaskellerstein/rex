[project]
name = "agent-runner"
version = "0.1.0"
description = "Agent SDKs and gateways behind one interface. Knows nothing about documents, comments or databases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "deepagents>=0.7.13",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.1",
    "langchain-openai>=1.6.0",
    "openai-codex>=0.147.0",
    "pydantic>=2.0",
]

[project.scripts]
agent-runner = "agent_runner.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
