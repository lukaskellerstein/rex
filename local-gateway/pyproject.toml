[project]
name = "local-gateway"
version = "0.1.0"
description = "REX's own LiteLLM. Serves inference on one loopback port. Knows nothing about agents, documents or comments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "litellm[proxy]>=1.100.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
local-gateway = "local_gateway.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
